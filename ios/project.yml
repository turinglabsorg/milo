name: Milo
options:
  bundleIdPrefix: io.meaningtech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MiloKit:
    path: MiloKit
targets:
  Milo:
    type: application
    platform: iOS
    sources: [Milo]
    dependencies:
      - package: MiloKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.meaningtech.milo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Milo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Milo/Milo.entitlements
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    info:
      path: Milo/Info.plist
      properties:
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: io.meaningtech.milo.mailto
            CFBundleURLSchemes: [mailto]
  MiloUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MiloUITests]
    dependencies:
      - target: Milo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.meaningtech.milo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Milo
schemes:
  Milo:
    build:
      targets:
        Milo: all
    test:
      targets: [MiloUITests]
