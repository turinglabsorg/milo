name: TestFlight
on:
  workflow_dispatch:
jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Install the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Revoke stale CI signing certificates
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip3 install --quiet --break-system-packages "pyjwt[crypto]==2.10.1" "requests==2.32.3" || pip3 install --quiet "pyjwt[crypto]==2.10.1" "requests==2.32.3"
          python3 - <<PY
          import os, time, jwt, requests
          token = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 600,
                              "aud": "appstoreconnect-v1"}, os.environ["ASC_KEY_P8"], algorithm="ES256",
                             headers={"kid": os.environ["ASC_KEY_ID"]})
          base = "https://api.appstoreconnect.apple.com/v1"
          headers = {"Authorization": f"Bearer {token}"}
          certs = requests.get(base + "/certificates", headers=headers, params={"limit": 200}, timeout=30).json()["data"]
          for cert in certs:
              a = cert["attributes"]
              print(a["certificateType"], "|", a.get("displayName"), "|", a.get("name"), "|", a.get("expirationDate"))
          dev_types = {"DEVELOPMENT", "IOS_DEVELOPMENT"}
          dist_types = {"DISTRIBUTION", "IOS_DISTRIBUTION"}
          def by_ci(cert):
              return "created via api" in (cert["attributes"].get("displayName") or "").lower()
          stale = [c for c in certs if by_ci(c) and c["attributes"]["certificateType"] in dev_types]
          dist = sorted((c for c in certs if by_ci(c) and c["attributes"]["certificateType"] in dist_types),
                        key=lambda c: c["attributes"].get("expirationDate") or "")
          if len([c for c in certs if c["attributes"]["certificateType"] in dist_types]) >= 2:
              stale += dist
          for cert in stale:
              a = cert["attributes"]
              status = requests.delete(f"{base}/certificates/{cert[id]}", headers=headers, timeout=30).status_code
              print("revoked", a["certificateType"], a.get("displayName"), a.get("expirationDate"), status)
          print("revoked", len(stale), "of", len(certs))
          PY
      - name: Archive and upload to TestFlight
        run: |
          set -o pipefail
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -project ios/Milo.xcodeproj -scheme Milo -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Milo.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${AUTH[@]}" 2>&1 | tail -40
          xcodebuild -exportArchive -archivePath build/Milo.xcarchive \
            -exportOptionsPlist ios/Config/ExportOptions.plist -exportPath build/export "${AUTH[@]}" 2>&1 | tail -40
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
