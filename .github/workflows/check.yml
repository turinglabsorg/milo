name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check milo tests scripts install.py
      - run: uv run pytest -q
      - run: uv run playwright install --with-deps chromium
      - name: Browser flows
        run: |
          uv run milo --demo --data /tmp/milo-ci-demo --port 8026 > /tmp/milo-ci.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8026/api/status > /dev/null; then break; fi
            sleep 0.25
          done
          MILO_TEST_URL=http://127.0.0.1:8026 uv run pytest tests/test_browser.py -q
