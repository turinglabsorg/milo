[project]
name = "milo-mail"
version = "0.1.0"
description = "A thoughtful email client, powered by Ollama. Linux first, your inbox everywhere."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "cryptography>=44",
    "httpx>=0.28,<1",
    "google-auth-oauthlib>=1.2,<2",
    "requests>=2.32,<3",
    "nh3>=0.3,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.50", "ruff>=0.11"]

[project.scripts]
milo = "milo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["milo"]

[tool.hatch.build.targets.wheel.force-include]
web = "milo/web"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
