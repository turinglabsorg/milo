name: milo
services:
  server:
    image: milo-server:current
    build: .
    restart: unless-stopped
    init: true
    user: "${MILO_UID:-501}:${MILO_GID:-20}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      db:
        condition: service_healthy
    environment:
      MILO_DATA: /data
      MILO_CONTAINER: "1"
      MILO_DATABASE_URL: postgresql://milo@db:5432/milo
      MILO_DATABASE_PASSWORD_FILE: /data/db-password
      MILO_APNS_KEY_FILE: /data/apns.p8
      MILO_APNS_KEY_ID: 8WUQ44SUHT
      MILO_APNS_TEAM_ID: 89J2AG5K92
      MILO_APNS_TOPIC: io.meaningtech.milo
      MILO_PROXY_PEER: "10.241.84.1"
      MILO_PUBLIC_URL: https://milo.grooooog.space
      MILO_OLLAMA_URL: "${MILO_OLLAMA_URL:-http://host.docker.internal:11434}"
    volumes:
      - type: bind
        source: "${MILO_ARCHIVE:?Set MILO_ARCHIVE to the existing archive}"
        target: /data
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${MILO_LANDING_PORT:-8025}:8025"
      - "127.0.0.1:${MILO_PRIVATE_PORT:-8029}:8029"
    networks:
      - server
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; a=urllib.request.urlopen('http://127.0.0.1:8025/',timeout=3); assert a.headers.get('X-Milo-Surface')=='public'; s=json.load(urllib.request.urlopen('http://127.0.0.1:8029/api/status',timeout=3)); assert s['service']=='milo' and s['access']=='tailscale'"]
      interval: 15s
      timeout: 8s
      start_period: 30s
      retries: 3
    stop_grace_period: 180s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  db:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: milo
      POSTGRES_DB: milo
      # Used only to initialize an empty volume; Milo reads the password from the archive.
      POSTGRES_PASSWORD: "${MILO_DB_PASSWORD:-}"
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "effective_cache_size=2GB",
              "-c", "max_connections=200", "-c", "work_mem=32MB", "-c", "listen_addresses=*"]
    shm_size: 256m
    volumes:
      - milo-postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:${MILO_DB_PORT:-55433}:5432"
    networks:
      - server
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "milo", "-d", "milo"]
      interval: 10s
      timeout: 5s
      retries: 6
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  backup:
    image: postgres:18.4-alpine
    restart: unless-stopped
    user: "${MILO_UID:-501}:${MILO_GID:-20}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: milo
      PGDATABASE: milo
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        while true; do
          PGPASSWORD="$$(cat /archive/db-password)" pg_dump -Fc -f /backups/milo.tmp && \
            mv /backups/milo.tmp "/backups/milo-$$(date +%Y%m%d).dump" && \
            ls -1t /backups/milo-*.dump | tail -n +8 | xargs -r rm
          sleep 86400
        done
    volumes:
      - type: bind
        source: "${MILO_ARCHIVE:?Set MILO_ARCHIVE to the existing archive}"
        target: /archive
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${MILO_ARCHIVE:?Set MILO_ARCHIVE to the existing archive}/backups/postgres"
        target: /backups
    networks:
      - server
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
volumes:
  milo-postgres:
networks:
  server:
    ipam:
      config:
        - subnet: 10.241.84.0/24
          gateway: 10.241.84.1
